<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Comprehension quiz</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --card: #f6f7f9;
    --border: #e2e4e8; --accent: #2563eb; --ok: #15803d; --ok-bg: #dcfce7;
    --bad: #b91c1c; --bad-bg: #fee2e2; --code-bg: #f0f1f3; --pick: #dbeafe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --fg: #e6e8eb; --muted: #9aa0a6; --card: #171a21;
      --border: #2a2e37; --accent: #60a5fa; --ok: #4ade80; --ok-bg: #14351f;
      --bad: #f87171; --bad-bg: #3a1616; --code-bg: #0b0d11; --pick: #1e335c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 20px 96px; }
  header { position: sticky; top: 0; background: var(--bg); padding: 14px 0;
    border-bottom: 1px solid var(--border); z-index: 5; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .score { float: right; font-weight: 600; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; margin: 16px 0; }
  .qhead { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin-bottom: 6px; }
  .prompt { font-weight: 550; margin-bottom: 12px; }
  pre { background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: 13px;
    line-height: 1.5; margin: 0 0 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .opt { display: block; width: 100%; text-align: left; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    margin: 6px 0; cursor: pointer; color: inherit; font: inherit; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt.chosen { border-color: var(--accent); }
  .opt.correct { background: var(--ok-bg); border-color: var(--ok); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .lines { border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    margin-bottom: 12px; }
  .line { display: flex; gap: 10px; padding: 3px 10px; cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; background: var(--code-bg); white-space: pre; }
  .line:hover:not(.locked) { background: var(--pick); }
  .line.picked { background: var(--pick); }
  .line.correct { background: var(--ok-bg); }
  .line.wrong { background: var(--bad-bg); }
  .line .ln { color: var(--muted); user-select: none; min-width: 22px;
    text-align: right; }
  textarea { width: 100%; min-height: 80px; background: var(--bg); color: inherit;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font: inherit; resize: vertical; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 10px; }
  .btn.ghost { background: transparent; color: var(--accent);
    border: 1px solid var(--border); }
  .btn:disabled { opacity: .5; cursor: default; }
  .reveal { margin-top: 12px; padding: 12px 14px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border); display: none; }
  .reveal.show { display: block; }
  .reveal .label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin-bottom: 4px; }
  .selfassess { margin-top: 10px; }
  .selfassess button { margin-right: 6px; }
  .expl { margin-top: 10px; font-size: 14px; color: var(--muted);
    border-left: 3px solid var(--border); padding-left: 10px; }
  .verdict { font-weight: 700; }
  .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
  .verdict.partial { color: #b45309; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg);
    border-top: 1px solid var(--border); padding: 12px 20px; text-align: center; }
  .copied { color: var(--ok); font-size: 13px; margin-left: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="score" id="score"></span>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
  </header>
  <div id="questions"></div>
</div>
<footer>
  <button class="btn" id="copyBtn">Copy results</button>
  <span class="copied" id="copied" hidden>Copied — paste into chat.</span>
</footer>

<script>
const QUIZ = /*__QUIZ_DATA__*/null;

const results = {};      // id -> {verdict, answer}
let answered = 0, gradable = 0, correctCount = 0;

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function updateScore() {
  const total = QUIZ.questions.length;
  const scoreEl = document.getElementById("score");
  const auto = gradable ? ` · ${correctCount}/${gradable} auto-graded` : "";
  scoreEl.textContent = `${answered}/${total} answered${auto}`;
}

function verdictEl(v) {
  const map = { ok: ["ok", "✓ Correct"], partial: ["partial", "~ Partial"], bad: ["bad", "✗ Missed"] };
  const [cls, txt] = map[v] || ["", v];
  return `<span class="verdict ${cls}">${txt}</span>`;
}

function record(id, verdict, answer) {
  const first = !(id in results);
  results[id] = { verdict, answer };
  if (first) answered++;
  updateScore();
}

function renderMCQ(q, root) {
  const box = document.createElement("div");
  q.options.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt"; b.innerHTML = esc(opt); b.dataset.i = i;
    b.onclick = () => {
      if (box.dataset.done) return;
      box.dataset.done = "1";
      gradable++;
      const correct = i === q.answer;
      if (correct) correctCount++;
      [...box.querySelectorAll(".opt")].forEach((el, j) => {
        el.disabled = true;
        if (j === q.answer) el.classList.add("correct");
        if (j === i && !correct) el.classList.add("wrong");
      });
      showExplanation(root, q, correct ? "ok" : "bad");
      record(q.id, correct ? "ok" : "bad", q.options[i]);
    };
    box.appendChild(b);
  });
  root.appendChild(box);
}

function renderSelectLine(q, root) {
  const lines = q.lines || (q.code ? q.code.split("\n") : []);
  const answer = new Set(q.answer); // 1-based line numbers
  const picked = new Set();
  const wrap = document.createElement("div");
  wrap.className = "lines";
  lines.forEach((txt, idx) => {
    const n = idx + 1;
    const row = document.createElement("div");
    row.className = "line";
    row.innerHTML = `<span class="ln">${n}</span><span>${esc(txt)}</span>`;
    row.onclick = () => {
      if (wrap.dataset.done) return;
      row.classList.toggle("picked");
      picked.has(n) ? picked.delete(n) : picked.add(n);
    };
    wrap.appendChild(row);
  });
  root.appendChild(wrap);
  const submit = document.createElement("button");
  submit.className = "btn"; submit.textContent = "Submit selection";
  submit.onclick = () => {
    if (wrap.dataset.done) return;
    wrap.dataset.done = "1"; submit.disabled = true;
    [...wrap.children].forEach(r => r.classList.add("locked"));
    gradable++;
    let correct = picked.size === answer.size && [...picked].every(n => answer.has(n));
    if (correct) correctCount++;
    [...wrap.children].forEach((row, idx) => {
      const n = idx + 1;
      row.classList.remove("picked");
      if (answer.has(n)) row.classList.add("correct");
      else if (picked.has(n)) row.classList.add("wrong");
    });
    showExplanation(root, q, correct ? "ok" : "bad");
    record(q.id, correct ? "ok" : "bad", [...picked]);
  };
  root.appendChild(submit);
}

function renderFree(q, root) {
  const ta = document.createElement("textarea");
  ta.placeholder = "Type your answer…";
  root.appendChild(ta);
  const reveal = document.createElement("button");
  reveal.className = "btn"; reveal.textContent = "Reveal answer";
  root.appendChild(reveal);

  const panel = document.createElement("div");
  panel.className = "reveal";
  panel.innerHTML = `<div class="label">Model answer</div><div>${esc(q.answer)}</div>
    <div class="selfassess">
      <button class="btn ghost" data-v="ok">I got it</button>
      <button class="btn ghost" data-v="partial">Partly</button>
      <button class="btn ghost" data-v="bad">I missed it</button>
    </div>`;
  root.appendChild(panel);

  reveal.onclick = () => {
    panel.classList.add("show");
    reveal.disabled = true;
    ta.readOnly = true;
    showExplanation(root, q);
  };
  panel.querySelectorAll("[data-v]").forEach(btn => {
    btn.onclick = () => {
      panel.querySelectorAll("[data-v]").forEach(b => b.style.opacity = ".4");
      btn.style.opacity = "1";
      record(q.id, btn.dataset.v, ta.value);
    };
  });
}

function showExplanation(root, q, autoVerdict) {
  if (!q.explanation) return;
  if (root.querySelector(".expl")) return;
  const e = document.createElement("div");
  e.className = "expl";
  const v = autoVerdict ? verdictEl(autoVerdict) + " — " : "";
  e.innerHTML = v + esc(q.explanation);
  root.appendChild(e);
}

function typeLabel(t) {
  return { mcq: "Multiple choice", select_line: "Select the line(s)", free: "Short answer" }[t] || t;
}

function render() {
  document.getElementById("title").textContent = QUIZ.title || "Comprehension quiz";
  document.getElementById("subtitle").textContent = QUIZ.subtitle || "";
  const host = document.getElementById("questions");
  QUIZ.questions.forEach((q, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="qhead">Q${i + 1} · ${typeLabel(q.type)}</div>
      <div class="prompt">${esc(q.prompt)}</div>`;
    if (q.code && q.type !== "select_line") {
      const pre = document.createElement("pre");
      pre.textContent = q.code;
      card.appendChild(pre);
    }
    const slot = document.createElement("div");
    card.appendChild(slot);
    if (q.type === "mcq") renderMCQ(q, slot);
    else if (q.type === "select_line") renderSelectLine(q, slot);
    else renderFree(q, slot);
    host.appendChild(card);
  });
  updateScore();
}

document.getElementById("copyBtn").onclick = async () => {
  const payload = {
    title: QUIZ.title,
    answered, total: QUIZ.questions.length,
    autoScore: gradable ? `${correctCount}/${gradable}` : null,
    results: QUIZ.questions.map(q => ({
      id: q.id, type: q.type, prompt: q.prompt,
      verdict: results[q.id]?.verdict ?? "unanswered",
      answer: results[q.id]?.answer ?? null,
    })),
  };
  const text = "QUIZ_RESULTS " + JSON.stringify(payload);
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  document.getElementById("copied").hidden = false;
};

render();
</script>
</body>
</html>
